[project]
name = "mcapi-auth"
version = "0.19.3"
description = "Async Python client for Microsoft → Minecraft authentication and the Mojang REST APIs (typed, httpx-based)"
readme = "README.md"
license = { text = "MIT" }
keywords = ["minecraft", "mojang", "xbox", "msa", "authentication", "oauth", "api", "mcauth", "mcapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
authors = [
    { name = "clawdbot-silly-waddle", email = "clawdbot-silly-waddle@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.13.4",
    "whenever>=0.10.0",
]

[project.optional-dependencies]
bedrock = ["cryptography>=43"]

[project.urls]
Repository = "https://github.com/clawdbot-silly-waddle/mcapi-auth"
Issues = "https://github.com/clawdbot-silly-waddle/mcapi-auth/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcapi_auth"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.4",
    "cryptography>=43",
    "hypothesis>=6.152.7",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.13",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]
e2e = [
    "playwright>=1.49",
    "pytest-playwright>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring a real Microsoft account and a logged-in Playwright session",
]

[tool.coverage.run]
source = ["src/mcapi_auth"]
branch = true
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.basedpyright]
include = ["src/mcapi_auth", "tests", "examples"]
extraPaths = ["."]
pythonVersion = "3.14"
typeCheckingMode = "standard"
strict = ["src/mcapi_auth"]
executionEnvironments = [
    { root = "tests", reportPrivateUsage = "none", reportUnknownMemberType = "none", reportUnknownArgumentType = "none", reportUnknownVariableType = "none", reportUnknownParameterType = "none", reportMissingTypeStubs = "none" },
    { root = "examples" },
]
reportUnusedCallResult = false
