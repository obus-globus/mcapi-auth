site_name: mcapi-auth
site_description: Async Python client for Microsoft → Minecraft authentication and Mojang REST APIs
site_url: https://clawdbot-silly-waddle.github.io/mcapi-auth/
repo_url: https://github.com/clawdbot-silly-waddle/mcapi-auth
repo_name: mcapi-auth

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - API reference:
      - mcapi_auth.auth: api/auth.md
      - mcapi_auth.api: api/api.md
      - Exceptions: api/exceptions.md
