name: SBOM

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cyclonedx:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Pin Python (3.14)
        run: uv python install 3.14

      - name: Sync runtime dependencies (no dev)
        run: uv sync --all-extras

      - name: Install cyclonedx-py
        run: uv pip install cyclonedx-bom

      - name: Generate CycloneDX SBOM (JSON)
        run: |
          uv run cyclonedx-py environment \
            --output-format json \
            --output-file sbom.cdx.json

      - name: Generate CycloneDX SBOM (XML)
        run: |
          uv run cyclonedx-py environment \
            --output-format xml \
            --output-file sbom.cdx.xml

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.cdx.xml

      - name: Attach SBOM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            sbom.cdx.json
            sbom.cdx.xml

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Pin Python (3.14)
        run: uv python install 3.14

      - name: Sync deps
        run: uv sync --all-extras

      - name: pip-audit
        run: |
          uv pip install pip-audit
          uv run pip-audit --skip-editable --progress-spinner off
